name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -o Sijil_Darajat_AllIjtimaiyat_GitHub_Ready_v1.zip -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/project" \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android project found at: $PROJECT_DIR"

      - name: Fix Java and Kotlin JVM versions
        run: |
          cd "$PROJECT_DIR"

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 | \
          xargs -0 sed -i \
          -e 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
          -e 's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' \
          -e 's/jvmTarget[[:space:]]*=[[:space:]]*"1.8"/jvmTarget = "17"/g' \
          -e 's/jvmTarget[[:space:]]*=[[:space:]]*"8"/jvmTarget = "17"/g'

          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -maxdepth 5 -print

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle wrapper --gradle-version 8.10.2
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sijil-Darajat-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
