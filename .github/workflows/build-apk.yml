name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          ROOT=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Android project: $ROOT"

      - name: Fix AndroidX and Java/Kotlin JVM
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          find . -type f \( \
            -name "build.gradle" \
            -o -name "build.gradle.kts" \
          \) -print0 | while IFS= read -r -d '' file
          do
            echo "Fixing: $file"

            sed -i \
              -e 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' \
              -e 's/JavaVersion\.VERSION_8/JavaVersion.VERSION_17/g' \
              -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
              -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']8["'\'']/jvmTarget = "17"/g' \
              -e 's/sourceCompatibility[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/sourceCompatibility = "17"/g' \
              -e 's/targetCompatibility[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/targetCompatibility = "17"/g' \
              "$file"
          done

          echo "gradle.properties:"
          cat gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          chmod +x gradlew

          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sijil-Darajat-APK
          path: |
            ${{ env.ANDROID_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
