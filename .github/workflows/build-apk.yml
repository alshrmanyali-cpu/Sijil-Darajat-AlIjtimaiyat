name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Searching for Gradle project..."

          ROOT=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "Gradle project not found"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ROOT"

          ls -la "$ROOT"

      - name: Fix AndroidX and Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          touch gradle.properties

          grep -qxF 'android.useAndroidX=true' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -qxF 'android.enableJetifier=true' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

          grep -qxF 'kotlin.jvm.target.validation.mode=warning' gradle.properties || \
            echo 'kotlin.jvm.target.validation.mode=warning' >> gradle.properties

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.9-all.zip#g' \
              gradle/wrapper/gradle-wrapper.properties
          fi

          echo "gradle.properties:"
          cat gradle.properties

      - name: Fix Java and Kotlin JVM
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          if [ -f "app/build.gradle.kts" ]; then

            cat >> app/build.gradle.kts <<'EOF'

android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}
EOF

          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          if [ ! -f "gradlew" ]; then
            echo "Creating Gradle wrapper..."

            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sijil-Darajat-APK
          path: |
            ${{ env.ANDROID_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Post Set up Gradle
        run: echo "Build finished"
