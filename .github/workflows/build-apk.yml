name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project

          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find project -maxdepth 6 -type f | head -100
            exit 1
          fi

          ANDROID_ROOT=$(dirname "$GRADLEW")

          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$ANDROID_ROOT"

      - name: Fix AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          touch gradle.properties

          if ! grep -q "^android.useAndroidX=true" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=true" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "AndroidX fixed"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          chmod +x gradlew

          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          chmod +x gradlew

          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sijil-Darajat-APK
          path: ${{ env.ANDROID_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
