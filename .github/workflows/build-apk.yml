name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project

          if [ ! -f "project/settings.gradle.kts" ]; then
            echo "Android project not found"
            find project -maxdepth 6 -type f
            exit 1
          fi

          echo "Android project found successfully"

      - name: Fix AndroidX
        shell: bash
        run: |
          set -e

          cd project

          touch gradle.properties

          grep -q "^android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "^android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

          echo "AndroidX fixed"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd project

          gradle --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd project

          gradle clean
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sijil-Darajat-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
