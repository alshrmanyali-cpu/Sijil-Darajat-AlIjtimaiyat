name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find "$GITHUB_WORKSPACE/project" -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found. Searching for build.gradle:"
            find "$GITHUB_WORKSPACE/project" -type f -name "build.gradle" -o -name "build.gradle.kts"

            ROOT=$(find "$GITHUB_WORKSPACE/project" -type f -name "settings.gradle" -o -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)

            if [ -z "$ROOT" ]; then
              echo "ERROR: Android project root not found"
              exit 1
            fi

            echo "Android project root: $ROOT"
            echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"
          else
            ROOT=$(dirname "$GRADLEW")

            echo "Found gradlew: $GRADLEW"
            echo "Android project root: $ROOT"

            echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"
          fi

      - name: Fix AndroidX and Java/Kotlin JVM
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties

          echo "gradle.properties:"
          cat gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          if [ ! -f gradlew ]; then
            echo "gradlew missing - generating Gradle wrapper"
            gradle wrapper --gradle-version 8.10.2
          fi

          chmod +x gradlew

          echo "Gradle wrapper:"
          ls -la gradlew

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          ./gradlew clean

          ./gradlew assembleDebug \
            --stacktrace \
            -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sijil-Darajat-APK
          path: ${{ env.ANDROID_ROOT }}/
