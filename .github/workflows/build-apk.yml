name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP file: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          echo "Searching for Android project..."

          SETTINGS=$(find "$GITHUB_WORKSPACE/project" -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find "$GITHUB_WORKSPACE/project" -type f -name "settings.gradle" | head -n 1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find "$GITHUB_WORKSPACE/project" -maxdepth 6 -type f
            exit 1
          fi

          ANDROID_ROOT=$(dirname "$SETTINGS")

          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$ANDROID_ROOT"

      - name: Fix AndroidX and Java/Kotlin JVM
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          touch gradle.properties

          grep -qxF 'android.useAndroidX=true' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -qxF 'android.enableJetifier=true' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

          grep -qxF 'kotlin.jvm.target.validation.mode=warning' gradle.properties || \
            echo 'kotlin.jvm.target.validation.mode=warning' >> gradle.properties

          echo "gradle.properties:"
          cat gradle.properties

      - name: Show MainActivity source
        shell: bash
        run: |
          set -e

          MAIN_FILE="$ANDROID_ROOT/app/src/main/java/com/example/sijil1/MainActivity.kt"

          echo "========================================"
          echo "MainActivity.kt"
          echo "========================================"

          if [ -f "$MAIN_FILE" ]; then
            nl -ba "$MAIN_FILE" | sed -n '1,120p'
          else
            echo "MainActivity.kt not found"
            find "$ANDROID_ROOT/app/src/main/java" -type f
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Creating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sijil-Darajat-APK
          path: |
            ${{ env.ANDROID_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
